name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # The demo site is built from demo/schema.json on release; keep it buildable.
      - run: go run ./cmd/dbfolio build demo/schema.json -o "$RUNNER_TEMP/demo"
      - name: Check THIRD_PARTY_NOTICES is up to date
        run: |
          go run ./scripts/notices
          git diff --exit-code THIRD_PARTY_NOTICES

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.18.2
          args: check
