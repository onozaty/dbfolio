{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Root}}assets/app.css">
<script src="{{.Root}}assets/app.js" defer></script>
</head>
<body{{if .Fill}} class="fill"{{end}}>
<header class="site-header">
<a class="site-title" href="{{.Root}}index.html">{{.DBName}}</a>
<nav class="site-nav">
<a href="{{.Root}}index.html"{{if eq .Current "tables"}} aria-current="page"{{end}}>Tables</a>
<a href="{{.Root}}columns.html"{{if eq .Current "columns"}} aria-current="page"{{end}}>Columns</a>
<a href="{{.Root}}constraints.html"{{if eq .Current "constraints"}} aria-current="page"{{end}}>Constraints</a>
<a href="{{.Root}}relationships.html"{{if eq .Current "relationships"}} aria-current="page"{{end}}>Relationships</a>
</nav>
</header>
<main>
{{template "content" .}}
</main>
<footer class="site-footer">Generated by <a href="https://github.com/onozaty/dbfolio">dbfolio</a></footer>
</body>
</html>
{{end}}
