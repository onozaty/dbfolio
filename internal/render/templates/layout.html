{{define "layout"}}<!doctype html>
<html lang="en" data-root="{{.Root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Root}}assets/app.css">
{{if .CustomCSS}}<link rel="stylesheet" href="{{.Root}}assets/custom.css">
{{end}}<script src="{{.Root}}assets/app.js" defer></script>
<script src="{{.Root}}assets/search-index.js" defer></script>
<script src="{{.Root}}assets/search.js" defer></script>
</head>
<body{{if .Fill}} class="fill"{{end}}>
<header class="site-header">
<a class="site-title" href="{{.Root}}index.html">{{.DBName}}</a>
<nav class="site-nav">
<a href="{{.Root}}index.html"{{if eq .Current "tables"}} aria-current="page"{{end}}>Tables</a>
<a href="{{.Root}}relationships.html"{{if eq .Current "relationships"}} aria-current="page"{{end}}>Relationships</a>
{{if .HasFunctions}}<a href="{{.Root}}functions.html"{{if eq .Current "functions"}} aria-current="page"{{end}}>Functions</a>
{{end}}{{if .HasEnums}}<a href="{{.Root}}enums.html"{{if eq .Current "enums"}} aria-current="page"{{end}}>Enums</a>
{{end}}</nav>
<div class="search" role="search">
<input type="search" id="search-input" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search tables, columns, constraints and indexes" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-keyshortcuts="/">
<kbd class="search-key" aria-hidden="true">/</kbd>
<ul id="search-results" role="listbox" aria-label="Search results" hidden></ul>
<div id="search-status" class="search-status" aria-live="polite"></div>
</div>
</header>
<main>
{{template "content" .}}
</main>
<footer class="site-footer">Generated by <a href="https://github.com/onozaty/dbfolio">dbfolio</a></footer>
</body>
</html>
{{end}}
