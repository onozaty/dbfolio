# Release build configuration. Run by .github/workflows/release.yml on a v* tag.
# Check locally with: goreleaser release --snapshot --clean
version: 2

project_name: dbfolio

builds:
  - main: ./cmd/dbfolio
    binary: dbfolio
    env:
      # Graphviz runs as WebAssembly (go-graphviz), so no C toolchain is needed.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The licenses of bundled third-party software must ship with the binary.
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      # Merge commits only repeat the PR; the commits inside are listed anyway.
      - "^Merge pull request"
      - "^Merge branch"
      - "^Initial commit"

# Same setup as the other onozaty tools: the tap and the bucket are separate
# repositories, written with tokens that can push to them.
homebrew_casks:
  - name: dbfolio
    binaries:
      - dbfolio
    repository:
      owner: onozaty
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    description: "Generate browsable static HTML database documentation and ER diagrams from tbls schema.json"
    homepage: "https://github.com/onozaty/dbfolio"
    license: MIT
    # Not on snapshots or prereleases.
    skip_upload: auto

scoops:
  - repository:
      owner: onozaty
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    description: "Generate browsable static HTML database documentation and ER diagrams from tbls schema.json"
    homepage: "https://github.com/onozaty/dbfolio"
    license: MIT
    skip_upload: auto
