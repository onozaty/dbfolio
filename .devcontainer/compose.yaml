services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
      - claude-config:/home/vscode/.claude
      - gh-config:/home/vscode/.config/gh
    # Keep the container running so VS Code can attach
    command: sleep infinity
    # Share the db network namespace so PostgreSQL is reachable at localhost:5432
    network_mode: service:db
    environment:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dbfolio

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbfolio

volumes:
  postgres-data:
  claude-config:
  gh-config:
